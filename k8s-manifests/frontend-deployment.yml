apiVersion: apps/v1
kind: Deployment
metadata:
  name: proshop-frontend
  namespace: proshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proshop-frontend
  template:
    metadata:
      labels:
        app: proshop-frontend
    spec:
      containers:
        - name: proshop-frontend
          image: ashutosh8007/proshop-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: proshop-frontend-service
  namespace: proshop
spec:
  type: NodePort
  selector:
    app: proshop-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080